kind = "web"
previewPath = "/"
title = "Next.js App"
version = "1.0.0"
id = "artifacts/next-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22610

[services.development]
run = "pnpm --filter @workspace/next-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/next-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/next-app", "run", "start" ]

[services.env]
PORT = "22610"
